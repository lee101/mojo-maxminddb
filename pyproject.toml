[project]
name = "mojo-maxminddb"
version = "0.1.0"
description = "Mojo-accelerated MaxMind DB GeoIP lookups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "maxminddb", "mmdb", "geoip"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "maxminddb"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
